<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>North Star Bakery - Contact</title>
</head>
<body>
  <header>
    <h1>Contact & Pre‑Order</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Location & Hours</h2>
      <p><strong>Address:</strong> 123 North Star Lane, Modesto, CA</p>
      <p><strong>Hours:</strong> Mon–Fri 7am–6pm, Sat 8am–4pm, Sun Closed</p>
    </section>

    <section>
      <h2>Inquiry & Pre‑Order Form</h2>

      <form action="#" method="post">
        <fieldset>
          <legend>Customer Information</legend>

          <label for="name">Name:</label>
          <input id="name" name="name" type="text" required>

          <label for="email">Email:</label>
          <input id="email" name="email" type="email" required>
        </fieldset>

        <fieldset>
          <legend>Order Details</legend>

          <label for="pickup-date">Pickup Date:</label>
          <input id="pickup-date" name="pickup-date" type="date" required>

          <label for="request-type">Request Type:</label>
          <select id="request-type" name="request-type" required>
            <option value="">Select an option</option>
            <option value="pre-order">Pre‑order</option>
            <option value="question">General question</option>
          </select>

          <label for="item-details">Item Details:</label>
          <textarea id="item-details" name="item-details" rows="4" cols="40" required></textarea>

          <label for="allergy-notes">Allergy Notes (if applicable):</label>
          <textarea id="allergy-notes" name="allergy-notes" rows="3" cols="40"></textarea>
        </fieldset>

        <button type="submit">Submit Request</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 North Star Bakery</p>
  </footer>
</body>
</html>
